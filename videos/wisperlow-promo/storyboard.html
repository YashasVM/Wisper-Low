<figcaption><div class="lab"><b>02 · KEYFALL</b><span>02-keyfall · 0:05–0:11</span></div><p><b>The camera pulls back while keys rain down in honey-slow motion.</b> Every landing fires a repel shockwave that pushes its neighbours outward, then the field spirals into orbit around the lens.</p><em>continuous pull-back</em></figcaption></figure><figure id="frame-03"><div class="c"><b class="k3 orbit" style="left:25.4cqw;top:48.4%;transform:rotate(-10deg) perspective(30cqw) rotateX(35deg);font-size:2.3cqw;filter:blur(0.00cqw)">q</b><b class="k3 orbit" style="left:60.3cqw;top:11.1%;transform:rotate(-39deg) perspective(30cqw) rotateX(35deg);font-size:2.7cqw;filter:blur(0.00cqw)">w</b><b class="k3 orbit" style="left:27.3cqw;top:24.3%;transform:rotate(40deg) perspective(30cqw) rotateX(35deg);font-size:2.1cqw;filter:blur(0.00cqw)">e</b><b class="k3 orbit" style="left:79.3cqw;top:43.2%;transform:rotate(11deg) perspective(30cqw) rotateX(35deg);font-size:1.7cqw;filter:blur(0.29cqw)">r</b><b class="k3 orbit" style="left:82.1cqw;top:46.8%;transform:rotate(19deg) perspective(30cqw) rotateX(35deg);font-size:2.4cqw;filter:blur(0.00cqw)">t</b><b class="k3 orbit" style="left:9.8cqw;top:65.1%;transform:rotate(7deg) perspective(30cqw) rotateX(35deg);font-size:1.9cqw;filter:blur(0.11cqw)">y</b><b class="k3 orbit" style="left:81.9cqw;top:42.9%;transform:rotate(18deg) perspective(30cqw) rotateX(35deg);font-size:2.7cqw;filter:blur(0.00cqw)">u</b><b class="k3 orbit" style="left:68.3cqw;top:77.8%;transform:rotate(-8deg) perspective(30cqw) rotateX(35deg);font-size:2.6cqw;filter:blur(0.00cqw)">i</b><b class="k3 orbit" style="left:44.0cqw;top:79.0%;transform:rotate(30deg) perspective(30cqw) rotateX(35deg);font-size:1.6cqw;filter:blur(0.14cqw)">o</b><b class="k3 orbit" style="left:23.5cqw;top:81.3%;transform:rotate(-5deg) perspective(30cqw) rotateX(35deg);font-size:2.4cqw;filter:blur(0.00cqw)">p</b><b class="k3 orbit" style="left:31.1cqw;top:45.6%;transform:rotate(-9deg) perspective(30cqw) rotateX
