<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wisperlow — pick a design</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 40px; }
  h1 { font-weight: 600; }
  .g { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 24px; }
  a { color: inherit; text-decoration: none; border: 1px solid #2a2a2a; border-radius: 14px; overflow: hidden; display: block; transition: transform .3s, border-color .3s; }
  a:hover { transform: translateY(-4px); border-color: #555; }
  .f { height: 300px; overflow: hidden; position: relative; }
  iframe { width: 1440px; height: 1000px; border: 0; transform: scale(.33); transform-origin: 0 0; pointer-events: none; }
  p { margin: 0; padding: 14px 18px; } p span { color: #888; }
</style>
</head>
<body>
<h1>Wisperlow — 4 directions</h1>
<div class="g">
  <a href="v1/"><div class="f"><iframe src="v1/" loading="lazy"></iframe></div><p><b>V1 · Aurora</b> <span>— dark glass, gradient aurora, live waveform demo</span></p></a>
  <a href="v2/"><div class="f"><iframe src="v2/" loading="lazy"></iframe></div><p><b>V2 · Editorial</b> <span>— light, serif, magazine-style, word-by-word transcript</span></p></a>
  <a href="v3/"><div class="f"><iframe src="v3/" loading="lazy"></iframe></div><p><b>V3 · Engineered</b> <span>— mono/brutalist, terminal session, animated pipeline</span></p></a>
  <a href="v4/"><div class="f"><iframe src="v4/" loading="lazy"></iframe></div><p><b>V4 · Friendly</b> <span>— warm pastels, bento grid, bouncy mic orb</span></p></a>
</div>
</body>
</html>
